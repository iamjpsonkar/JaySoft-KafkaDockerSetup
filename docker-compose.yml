version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:3.9.3 # Use a stable version instead of latest
    platform: linux/arm64
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_SYNC_LIMIT: 2
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/data
      - zookeeper_datalog:/datalog
    networks:
      - kafka-net
    container_name: zookeeper
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.3.0 # Use a stable version instead of latest
    platform: linux/arm64
    environment:
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_LISTENER_NAMES: INSIDE,OUTSIDE
      KAFKA_LISTENER_SECURITY_PROTOCOL_INSIDE: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_OUTSIDE: PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_MESSAGE_MAX_BYTES: 200000000
      KAFKA_REPLICA_FETCH_MAX_BYTES: 200000000
      KAFKA_MAX_REQUEST_SIZE: 200000000
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kafka-net
    depends_on:
      - zookeeper
    container_name: kafka
    restart: unless-stopped

  akhq:
    image: tchiotludo/akhq:0.24.0 # Use a stable version instead of latest
    platform: linux/arm64
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            default:
              properties:
                bootstrap.servers: "kafka:9093"
    ports:
      - "8080:8080"
    networks:
      - kafka-net
    depends_on:
      - kafka
    container_name: akhq
    restart: unless-stopped

networks:
  kafka-net:
    driver: bridge

volumes:
  zookeeper_data:
  zookeeper_datalog:
  kafka_data:
